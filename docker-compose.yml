services:
  postgres:
    image: postgres:17-alpine
    container_name: agamotto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agamotto
      POSTGRES_USER: agamotto
      POSTGRES_PASSWORD: agamotto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
